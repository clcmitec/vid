<script>


/************************************************************
 * CONFIG
 ************************************************************/


/*
 * YOUR APPS SCRIPT WEB APP URL
 *
 * Example:
 *
 * https://script.google.com/macros/s/XXXXXXXX/exec
 */

const WEB_APP_URL =
  https://script.google.com/macros/s/AKfycbw9RtHkDeLeP7xXBFKpVtEahx_0vbavLchnh7-T69hYmwOC3J7wuoSKCpWfj1VZ9FCwfQ/exec';


/*
 * Must match Code.gs.
 */

const API_KEY =
  zqyH&F5YK';



/************************************************************
 * STATE
 ************************************************************/

let source =
  localStorage.getItem(
    'mvm_source'
  ) ||
  'drive';


let currentFolderId =
  localStorage.getItem(
    'mvm_folder'
  );


let currentFolderName =
  localStorage.getItem(
    'mvm_folder_name'
  ) ||
  'My Drive';


let allFolders =
  [];


let photosSessionId =
  null;


let selectedPhotos =
  [];


let pendingMoveFileId =
  null;


let statusTimer =
  null;



/************************************************************
 * INIT
 ************************************************************/

window.addEventListener(
  'load',
  async function() {

    updateSourceUI();


    if (
      source === 'photos'
    ) {

      showPhotosHome();

    }

    else {

      await driveStart();

    }

  }
);



/************************************************************
 * API URL
 ************************************************************/

function apiUrl(
  action,
  params = {}
) {

  const url =
    new URL(
      WEB_APP_URL
    );


  url.searchParams.set(
    'action',
    action
  );


  url.searchParams.set(
    'key',
    API_KEY
  );


  Object.keys(params)
    .forEach(
      function(k) {

        url.searchParams.set(
          k,
          params[k]
        );

      }
    );


  return url.toString();

}



/************************************************************
 * JSONP
 ************************************************************/

function apiGet(
  action,
  params = {}
) {

  return new Promise(
    function(resolve, reject) {

      const callbackName =
        '__mvm_' +
        Date.now() +
        '_' +
        Math.random()
          .toString(36)
          .slice(2);


      const script =
        document.createElement(
          'script'
        );


      window[callbackName] =
        function(data) {

          delete window[
            callbackName
          ];

          script.remove();

          resolve(
            data
          );

        };


      params.callback =
        callbackName;


      script.src =
        apiUrl(
          action,
          params
        );


      script.onerror =
        function() {

          delete window[
            callbackName
          ];

          script.remove();

          reject(
            new Error(
              'Unable to connect to Apps Script.'
            )
          );

        };


      document.body.appendChild(
        script
      );

    }
  );

}



/************************************************************
 * POST
 ************************************************************/

async function apiPost(
  data
) {

  const form =
    document.createElement(
      'form'
    );


  form.method =
    'POST';

  form.action =
    WEB_APP_URL;

  form.target =
    'mvm_post_frame';


  Object.keys(data)
    .forEach(
      function(key) {

        const input =
          document.createElement(
            'input'
          );

        input.type =
          'hidden';

        input.name =
          key;

        input.value =
          data[key];

        form.appendChild(
          input
        );

      }
    );


  let iframe =
    document.getElementById(
      'mvm_post_frame'
    );


  if (!iframe) {

    iframe =
      document.createElement(
        'iframe'
      );

    iframe.id =
      'mvm_post_frame';

    iframe.name =
      'mvm_post_frame';

    iframe.style.display =
      'none';

    document.body.appendChild(
      iframe
    );

  }


  document.body.appendChild(
    form
  );


  form.submit();


  form.remove();


  await wait(
    1200
  );


  return {
    success: true
  };

}



/************************************************************
 * DRIVE START
 ************************************************************/

async function driveStart() {

  if (
    currentFolderId
  ) {

    loadFolder(
      currentFolderId
    );

    return;

  }


  await driveRoot();

}



/************************************************************
 * DRIVE ROOT
 ************************************************************/

async function driveRoot() {

  source =
    'drive';


  saveState();


  closeDrawer();


  showStatus(
    'Opening Drive...'
  );


  try {

    const result =
      await apiGet(
        'root'
      );


    if (
      !result.success
    ) {

      throw new Error(
        result.error
      );

    }


    currentFolderId =
      result.folder.id;


    currentFolderName =
      result.folder.name;


    saveState();


    await loadFolder(
      currentFolderId
    );

  }

  catch (error) {

    showStatus(
      error.message
    );

  }

}



/************************************************************
 * LOAD FOLDER
 ************************************************************/

async function loadFolder(
  folderId
) {

  showContent();


  showStatus(
    'Loading...'
  );


  try {

    const result =
      await apiGet(

        'contents',

        {
          folderId:
            folderId
        }

      );


    if (
      !result.success
    ) {

      throw new Error(
        result.error
      );

    }


    currentFolderId =
      result.folder.id;


    currentFolderName =
      result.folder.name;


    saveState();


    renderFolder(
      result
    );


    hideStatus();

  }

  catch (error) {

    showStatus(
      error.message
    );

  }

}



/************************************************************
 * RENDER FOLDER
 ************************************************************/

function renderFolder(
  data
) {

  const content =
    document.getElementById(
      'content'
    );


  let html =
    '<div class="section-label">' +
    escapeHtml(
      data.folder.name
    ) +
    '</div>';


  data.folders
    .forEach(
      function(folder) {

        html += `

          <div
            class="folder"
            onclick="
              loadFolder(
                '${escapeJs(folder.id)}'
              )
            "
          >

            <div class="folder-icon">
              📁
            </div>

            <div class="folder-name">
              ${escapeHtml(folder.name)}
            </div>

            <div>
              ›
            </div>

          </div>

        `;

      }
    );


  data.videos
    .forEach(
      function(video) {

        html +=
          driveVideoCard(
            video
          );

      }
    );


  if (
    !data.folders.length &&
    !data.videos.length
  ) {

    html += `

      <div class="empty">

/************************************************************

 ************************************************************/

async function startPhotosPicker() {

  closeDrawer();


  showStatus(
    'Preparing Google Photos...'
  );


  try {

    const result =
      await apiGet(
        'photosCreateSession'
      );


    if (
      !result.success
    ) {

      throw new Error(
        result.error
      );

    }


    photosSessionId =
      result.sessionId;


    /*
     * Store session so Android returning
     * to this page doesn't lose it.
     */

    sessionStorage.setItem(
      'mvm_photos_session',
      photosSessionId
    );


    /*
     * Google requires the picker URI
     * to be opened outside an embedded
     * webview/iframe.
     */

    window.location.href =
      result.pickerUri;


    /*
     * Polling continues when page remains
     * alive. Android may suspend this page,
     * so resume logic below also checks
     * sessionStorage.
     */

    pollPhotos();

  }

  catch (error) {

    showStatus(
      error.message
    );

  }

}



/************************************************************
 * RESUME PHOTOS SESSION
 ************************************************************/

window.addEventListener(
  'pageshow',
  function() {

    const saved =
      sessionStorage.getItem(
        'mvm_photos_session'
      );


    if (
      saved
    ) {

      photosSessionId =
        saved;


      pollPhotos();

    }

  }
);



document.addEventListener(
  'visibilitychange',
  function() {

    if (
      document.visibilityState ===
      'visible'
    ) {

      const saved =
        sessionStorage.getItem(
          'mvm_photos_session'
        );


      if (
        saved
      ) {

        photosSessionId =
          saved;

        pollPhotos();

      }

    }

  }
);



/************************************************************
 * POLL PHOTOS
 ************************************************************/

let pollingActive =
  false;


async function pollPhotos() {

  if (
    !photosSessionId
  ) {

    return;

  }


  if (
    pollingActive
  ) {

    return;

  }


  pollingActive =
    true;


  try {

    const result =
      await apiGet(

        'photosGetSession',

        {
          sessionId:
            photosSessionId
        }

      );


    if (
      !result.success
    ) {

      throw new Error(
        result.error
      );

    }


    const session =
      result.session;


    if (
      session.mediaItemsSet
    ) {

      await retrievePhotos();

      return;

    }


    pollingActive =
      false;


    const seconds =
      parseSeconds(
        session
          .pollingConfig
          ?.pollInterval
      ) ||
      2;


    setTimeout(

      function() {

        pollingActive =
          false;

        pollPhotos();

      },

      seconds * 1000

    );

  }

  catch (error) {

    pollingActive =
      false;

    showStatus(
      error.message
    );

  }

}



/************************************************************
 * RETRIEVE PHOTOS
 ************************************************************/

async function retrievePhotos() {

  showStatus(
    'Loading selected videos...'
  );


  try {

    const result =
      await apiGet(

        'photosListMedia',

        {
          sessionId:
            photosSessionId
        }

      );


    if (
      !result.success
    ) {

      throw new Error(
        result.error
      );

    }


    selectedPhotos =
      result.videos ||
      [];


    /*
     * Store only metadata.
     *
     * Do NOT permanently store baseUrl.
     * Google says media URLs expire.
     */

    saveSelectedPhotoMetadata();


    sessionStorage.removeItem(
      'mvm_photos_session'
    );


    const oldSession =
      photosSessionId;


    photosSessionId =
      null;


    /*
     * Clean up picker session.
     */

    apiGet(

      'photosDeleteSession',

      {
        sessionId:
          oldSession
      }

    )
    .catch(
      function() {}
    );


    renderSelectedPhotos();


    hideStatus();

  }

  catch (error) {

    showStatus(
      error.message
    );

  }

}



/************************************************************
 * SAVE PHOTO METADATA
 ************************************************************/

function saveSelectedPhotoMetadata() {

  const metadata =
    selectedPhotos.map(
      function(item) {

        return {

          id:
            item.id,

          filename:
            item.filename ||
            'Google Photos video',

          mimeType:
            item.mediaFile
              ?.mimeType ||
            '',

          width:
            item.mediaMetadata
              ?.width ||
            0,

          height:
            item.mediaMetadata
              ?.height ||
            0,

          creationTime:
            item.mediaMetadata
              ?.creationTime ||
            ''

        };

      }
    );


  localStorage.setItem(

    'mvm_photos_metadata',

    JSON.stringify(
      metadata
    )

  );

}



/************************************************************
 * RENDER PHOTOS
 ************************************************************/

function showSelectedPhotos() {

  closeDrawer();

  showContent();


  renderSelectedPhotos();

}



function renderSelectedPhotos() {

  const content =
    document.getElementById(
      'content'
    );


  if (
    !selectedPhotos.length
  ) {

    const stored =
      localStorage.getItem(
        'mvm_photos_metadata'
      );


    if (stored) {

      try {

        /*
         * Metadata alone cannot play a video,
         * so inform user that re-selection is
         * required.
         */

      }

      catch (
        ignored
      ) {}

    }


    content.innerHTML = `

      <div class="empty">

        <div class="empty-icon">
          📸
        </div>

        No videos selected.

        <br><br>

        Tap ☰ → Google Photos →
        Select videos.

      </div>

    `;

    return;

  }


  let html = `

    <div class="section-label">
      Selected Google Photos Videos
    </div>

  `;


  selectedPhotos.forEach(
    function(item, index) {

      const media =
        item.mediaFile ||
        {};


      const metadata =
        item.mediaMetadata ||
        {};


      const thumb =
        media.baseUrl
          ? media.baseUrl +
            '=w720-h405'
          : '';


      const duration =
        formatDuration(
          metadata.durationMillis
        );


      html += `

        <div class="photo-card">

          ${
            thumb

              ? `

                <img
                  class="photo-thumb"
                  src="${escapeAttr(thumb)}"
                  loading="lazy"
                  alt=""
                >

              `

              : `

                <div
                  class="photo-thumb"
                  style="
                    display:flex;
                    align-items:center;
                    justify-content:center;
                    font-size:40px;
                  "
                >
                  🎬
                </div>

              `
          }


          <div class="photo-info">

            <div class="photo-name">

              ${escapeHtml(
                item.filename ||
                'Google Photos video'
              )}

            </div>


            <div class="photo-meta">

              Google Photos

              ${
                duration
                  ? ' · ' + duration
                  : ''
              }

              ${
                metadata.width &&
                metadata.height

                  ? ' · ' +
                    metadata.width +
                    '×' +
                    metadata.height

                  : ''
              }

            </div>


            <button
              class="btn primary photo-play"
              onclick="
                playPhoto(
                  ${index}
                )
              "
            >

              ▶ Play

            </button>

          </div>

        </div>

      `;

    }
  );


  content.innerHTML =
    html;

}



/************************************************************
 * PLAY PHOTOS VIDEO
 ************************************************************/

function playPhoto(
  index
) {

  const item =
    selectedPhotos[index];


  if (!item) {

    return;

  }


  const media =
    item.mediaFile ||
    {};


  const metadata =
    item.mediaMetadata ||
    {};


  if (
    !media.baseUrl
  ) {

    showStatus(
      'Google Photos did not provide a playable URL.'
    );

    return;

  }


  /*
   * Google Photos requires =dv for video.
   */

  const videoUrl =
    media.baseUrl +
    '=dv';


  const stage =
    document.getElementById(
      'videoStage'
    );


  stage.innerHTML = `

    <video
      id="mainVideo"
      controls
      playsinline
      preload="metadata"
      src="${escapeAttr(videoUrl)}"
    ></video>

  `;


  const video =
    document.getElementById(
      'mainVideo'
    );


  /*
   * Automatically enter fullscreen only
   * when the user explicitly presses our
   * fullscreen button. Don't force it.
   */

  video.addEventListener(
    'error',
    function() {

      showStatus(
        'Google Photos video could not be played. Try selecting it again.'
      );

    }
  );


  document.getElementById(
    'nowPlaying'
  ).textContent =
    item.filename ||
    'Google Photos video';


  source =
    'photos';


  updateSourceUI();


  showPlayer();

}

/************************************************************
 * UTILITIES
 ************************************************************/

function wait(
  ms
) {

  return new Promise(
    function(resolve) {

      setTimeout(
        resolve,
        ms
      );

    }
  );

}



function formatBytes(
  bytes
) {

  if (
    !bytes ||
    bytes <= 0
  ) {

    return '0 B';

  }


  const units = [
    'B',
    'KB',
    'MB',
    'GB',
    'TB'
  ];


  const index =
    Math.floor(
      Math.log(bytes) /
      Math.log(1024)
    );


  return (

    bytes /
    Math.pow(
      1024,
      index
    )

  )
  .toFixed(
    index === 0
      ? 0
      : 1
  ) +
  ' ' +
  units[index];

}



function formatDuration(
  milliseconds
) {

  if (
    !milliseconds
  ) {

    return '';

  }


  const totalSeconds =
    Math.floor(
      Number(
        milliseconds
      ) / 1000
    );


  const hours =
    Math.floor(
      totalSeconds / 3600
    );


  const minutes =
    Math.floor(
      (
        totalSeconds % 3600
      ) / 60
    );


  const seconds =
    totalSeconds % 60;


  if (hours) {

    return (
      hours +
      ':' +
      String(
        minutes
      ).padStart(
        2,
        '0'
      ) +
      ':' +
      String(
        seconds
      ).padStart(
        2,
        '0'
      )
    );

  }


  return (
    minutes +
    ':' +
    String(
      seconds
    ).padStart(
      2,
      '0'
    )
  );

}



function parseSeconds(
  value
) {

  if (!value) {
    return 0;
  }


  const match =
    String(value)
      .match(
        /^([\d.]+)s$/
      );


  return match
    ? Number(
        match[1]
      )
    : 0;

}



/************************************************************
 * ESCAPING
 ************************************************************/

function escapeHtml(
  value
) {

  return String(
    value ?? ''
  )

  .replace(
    /&/g,
    '&amp;'
  )

  .replace(
    /</g,
    '&lt;'
  )

  .replace(
    />/g,
    '&gt;'
  )

  .replace(
    /"/g,
    '&quot;'
  )

  .replace(
    /'/g,
    '&#039;'
  );

}



function escapeAttr(
  value
) {

  return escapeHtml(
    value
  );

}



function escapeJs(
  value
) {

  return String(
    value ?? ''
  )

  .replace(
    /\\/g,
    '\\\\'
  )

  .replace(
    /'/g,
    "\\'"
  )

  .replace(
    /\r/g,
    '\\r'
  )

  .replace(
    /\n/g,
    '\\n'
  );

}
